<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicios de tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
        }

        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        th,td{
            border: 1px solid gray;
            padding: 10px;
            text-align: center;
            
        }

        destaque{
            background-color: chartreuse;
                }

        col.cnome{
            background-color: chartreuse;
        }

        col.csexo{
            background-color: lightblue;
        }

        col.cidade{
            background-color: lightyellow;
        }

        col.cprof{
            background-color: lightpink;
        }
    </style>
</head>
<body>
    <h1>Exercicios de tabelas</h1>
   
    <table>
        <col class="cnome">
        <col class="csexo">
        <col class="cidade">
        <col class="cprof">
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr class="destaque">
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>João Pedro</td>
            <td>M</td>
            <td>30</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Maria Clara</td>
            <td>F</td>
            <td>28</td>
            <td>Advogada</td>
        </tr>
        <tr class="destaque">
            <td>Lucas Silva</td>
            <td>M</td>
            <td>35</td>
            <td>Engenheiro</td>
        </tr>
        <tr>
            <td>Fernanda Souza</td>
            <td>F</td>
            <td>32</td>
            <td>Médica</td>
        </tr>
        <tr>
            <td>Rafael Costa</td>
            <td>M</td>
            <td>29</td>
            <td>Professor</td>
        </tr>
    </table>
</body>
</html>
